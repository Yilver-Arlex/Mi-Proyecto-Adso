info:
  name: 08 -  ID inválido (400)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/1234"

runtime:
  scripts:
    - type: tests
      code: |-
        test("ID invalido (400)", function () {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.code).to.equal("INVALID_ID");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Envia: Una peticion GET con el parametro query 1234

  Debe responder: 400 con success false, error "Bas Request", code "INVALID_ID"

  Demuestra: El backend valida que el identificador tenga formato UUID, isUuid() rechaza identificadores que no cumplen el formato esperado y la validación ocurre antes de consultar PostgreSQL.
