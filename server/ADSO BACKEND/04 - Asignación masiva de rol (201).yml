info:
  name: 04 - Asignación masiva de rol (201)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/dev/users"
  body:
    type: json
    data: |-
      {
        "email": "intento.admin@misena.edu.co",
        "role": "admin"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Asignación masiva de rol (201 Created)", function () {
          expect(res.status).to.equal(201);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.email).to.equal("intento.admin@misena.edu.co");
          expect(res.body.data.role).to.equal("user");
          expect(res.body.data.is_verified).to.equal(false);
          expect(res.body.data).to.not.have.property("password_hash");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Envia: {"email": "[intento.admin@misena.edu.co](mailto:intento.admin@misena.edu.co)", "rol":  "admin"}.

  Debe responde: 201 con id (UUID generado por postgreSQL), email, role "user", is_verified false y sin password hash

  Demuestra: Que lo que llegue frontend solo se utilizara lo que sea realmente necesario
