info:
  name: 02 - Crear usuario (201 Created)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/dev/users"
  body:
    type: json
    data: |-
      {
        "email": "Nuevo.Aprendiz@MiSena.edu.co"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Crear Usuario (201 Created)", function () {
            expect(res.status).to.equal(201);
            expect(res.body.success).to.equal(true);
            expect(res.body.data.email).to.equal("nuevo.aprendiz@misena.edu.co");
            expect(res.body.data.role).to.equal("user");
            expect(res.body.data.is_verified).to.equal(false);
            expect(res.body.data).to.not.have.property("password_hash");
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Envía: { "email": "[Nuevo.Aprendiz@MiSena.edu.co](mailto:Nuevo.Aprendiz@MiSena.edu.co)" } (con mayúsculas a propósito).

  Debe responder: 201 con [data.id](http://data.id) (UUID generado por PostgreSQL), email en minúsculas, role "user", is_verified false y SIN password_hash.

  Demuestra: normalizeEmail() + RETURNING con columnas explícitas.
