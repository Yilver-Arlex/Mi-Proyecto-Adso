info:
  name: " 07 - Inyección SQL en email (404)"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/by-email?email='OR'1'='1'--@x.co"
  params:
    - name: email
      value: "'OR'1'='1'--@x.co"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("inyeccion SQL en email (404)", function () {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.code).to.equal("USER_NOT_FOUND");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Envia: una peticion GET con el parametro query email='OR'1'='1'--@x.co

  Debe responder: 404 con success false, error "Not Found", code "USER_NOT_FOUND"

  Demuestra: El payload supera la validacion de formato de correo, la consulta parametrizada utiliza $1 para tratar el valor como un dato y no como código SQL y el intento de SQL Injection no altera la consulta ni permite obtener usuarios.
