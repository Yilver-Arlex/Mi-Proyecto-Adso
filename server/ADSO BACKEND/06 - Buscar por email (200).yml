info:
  name: 06 - Buscar por email (200)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/by-email?email=Nuevo.Aprendiz@MiSena.edu.co"
  params:
    - name: email
      value: Nuevo.Aprendiz@MiSena.edu.co
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("Buscar por email (200 OK)", function () {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.id).to.be.a("string");
          expect(res.body.data.email).to.equal("nuevo.aprendiz@misena.edu.co");
          expect(res.body.data.role).to.equal("user");
          expect(res.body.data.is_verified).to.equal(false);
          expect(res.body.data).to.not.have.property("password_hash");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Envia: una peticion GET con el parametro query email=Nuevo.Aprendiz@MiSena.edu.co

  Debe responder: 200 con id (UUID generado por postgreSQL), email, role "user", is_verified false

  Demuestra: La busqueda de usuarios por corro electronico y la lectura del parametro mediante req.query.email.
